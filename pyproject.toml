[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "speech-grammar"
version = "1.0.0"
description = "Speech transcription + grammar correction service for monitoring children's English learning (Whisper + T5)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "FP NLP Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependencies only: the production image runs on CTranslate2 (no PyTorch needed).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "numpy>=1.26",
    "ctranslate2>=4.5",
    "faster-whisper>=1.1",
    "tokenizers>=0.19",
    "cryptography>=42",
    "psutil>=5.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# PyTorch backend (fallback inference, CTranslate2 conversion, training).
torch = ["torch>=2.3", "transformers>=4.44,<5", "sentencepiece>=0.2"]
# Opt-in cloud speech-to-text (sends audio to a third party: read the privacy section first).
cloud = ["google-genai>=1.0"]
# Error-type classification of edits (ERRANT), useful for learner feedback.
errant = ["errant>=3.0", "spacy>=3.7,<4"]
train = [
    "speech-grammar[torch]",
    "accelerate>=0.33",
    "pandas>=2.0",
    "sacrebleu>=2.4",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-psutil",
    "pandas>=2.0",
    "sacrebleu>=2.4",
]

[project.scripts]
speech-grammar = "speech_grammar.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/speech_grammar"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = [".venv", ".cache", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "D", "S", "PTH", "RET", "ASYNC"]
ignore = [
    "D105",   # magic methods do not need docstrings
    "D107",   # __init__ documented on the class
    "S101",   # asserts are fine in tests and invariants
    "RUF001", # we intentionally handle unicode quotes
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "ANN", "PTH"]
"scripts/**" = ["D101", "D103", "S311", "S603", "S607", "T201"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "ctranslate2.*",
    "faster_whisper.*",
    "av.*",
    "errant.*",
    "spacy.*",
    "google.*",
    "transformers.*",
    "torch.*",
    "sacrebleu.*",
    "pandas.*",
    "tokenizers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: needs real model weights (skipped automatically when models are missing)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["speech_grammar"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
