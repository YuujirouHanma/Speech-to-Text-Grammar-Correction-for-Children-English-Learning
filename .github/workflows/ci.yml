# CI for the speakfix service. Assumes speakfix/ is the repository root.
# If you version the parent FPFIX folder instead, move this file to
# FPFIX/.github/workflows/, add `defaults: {run: {working-directory: speakfix}}`
# and prefix the docker context/file paths with `speakfix/`.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src

  test:
    name: tests (py${{ matrix.python }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The versions that ship (constraints.txt, also used by the Docker images).
          - python: "3.12"
            deps: locked
            pins: -c constraints.txt
          # Canary: newest releases that support 3.11, to catch upstream breakage early.
          - python: "3.11"
            deps: latest
            pins: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install ${{ matrix.pins }} -e ".[dev]"
      # Real-model tests are marked `slow` and skip themselves when models/ is absent.
      - run: pytest -m "not slow" --cov=speakfix --cov-report=term --cov-report=xml --cov-fail-under=75
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: "**/coverage.xml"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip install -c constraints.txt -e . && pip-audit --skip-editable

  docker:
    name: build image (cpu)
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: speakfix:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
