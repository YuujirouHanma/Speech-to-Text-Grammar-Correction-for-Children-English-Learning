<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpeakFix — English speaking practice</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header>
    <h1>SpeakFix</h1>
    <p>Say or type an English sentence and get friendly grammar feedback.</p>
  </header>

  <main>
    <section class="card">
      <label class="consent">
        <input type="checkbox" id="consent">
        <span>I am the parent/guardian, or a teacher with verified parental consent, and I agree
          that this recording is processed. Audio is processed in memory and never stored.</span>
      </label>
      <details>
        <summary>API key (only if this server requires one)</summary>
        <input id="apiKey" type="password" autocomplete="off" placeholder="X-API-Key">
      </details>
    </section>

    <section class="card">
      <h2>Speak</h2>
      <div class="row">
        <button id="recordBtn" class="primary" type="button">Start recording</button>
        <span id="timer" class="muted">0:00 / 0:60</span>
      </div>
      <div class="row">
        <label class="file">Or upload a recording
          <input id="fileInput" type="file" accept="audio/*">
        </label>
      </div>
      <audio id="playback" controls hidden></audio>
    </section>

    <section class="card">
      <h2>Type</h2>
      <textarea id="textInput" rows="3" maxlength="2000" placeholder="She don't like apples."></textarea>
      <button id="checkBtn" type="button">Check grammar</button>
    </section>

    <section class="card" id="result" hidden>
      <h2>Feedback</h2>
      <p class="label">What we heard / what you wrote</p>
      <p id="original" class="quote"></p>
      <p class="label">Better English</p>
      <p id="corrected" class="quote corrected"></p>
      <ul id="edits" class="edits"></ul>
      <p id="praise" class="praise" hidden>Great job, no mistakes found!</p>
      <p id="warnings" class="muted"></p>
      <p id="timing" class="muted"></p>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <footer>
    <a href="/docs">API docs</a> · <a href="/readyz">status</a>
  </footer>
</body>
</html>
